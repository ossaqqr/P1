openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: planner
    description: Weekly planner operations
  - name: mission
    description: Personal mission and principles
  - name: roles
    description: Life roles management
  - name: weeklyPlan
    description: Weekly goals and tasks
  - name: principles
    description: Individually managed personal principles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /planner/data:
    get:
      operationId: getPlannerData
      tags: [planner]
      summary: Get the current planner data
      responses:
        "200":
          description: Current planner data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerData"
        "401":
          description: Unauthorized
    put:
      operationId: savePlannerData
      tags: [planner]
      summary: Save the current planner data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerDataInput"
      responses:
        "200":
          description: Saved planner data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerData"
        "401":
          description: Unauthorized
  /planner/analyze:
    post:
      operationId: analyzePlannerReview
      tags: [planner]
      summary: Analyze weekly goal review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAnalysisInput"
      responses:
        "200":
          description: Goal-by-goal review analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAnalysis"
        "401":
          description: Unauthorized
        "502":
          description: Upstream analysis service failure
  /mission:
    get:
      operationId: getMission
      tags: [mission]
      summary: Get the user's personal mission and principles
      responses:
        "200":
          description: Current mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          description: Unauthorized
    put:
      operationId: saveMission
      tags: [mission]
      summary: Save the user's personal mission and principles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionInput"
      responses:
        "200":
          description: Saved mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          description: Unauthorized
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all of the user's roles (active and inactive)
      responses:
        "200":
          description: Roles ordered by sortOrder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LifeRole"
        "401":
          description: Unauthorized
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleInput"
      responses:
        "200":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeRole"
        "401":
          description: Unauthorized
  /roles/{roleId}:
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Update a role's fields (name, description, direction, active, order)
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleInput"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeRole"
        "401":
          description: Unauthorized
        "404":
          description: Role not found
  /weeks/{weekStartDate}/plan:
    get:
      operationId: getWeekPlan
      tags: [weeklyPlan]
      summary: Get all goals and tasks for one week (weekStartDate = YYYY-MM-DD, the Saturday that starts the week)
      parameters:
        - name: weekStartDate
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The week's goals and their tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekPlan"
        "400":
          description: Invalid date
        "401":
          description: Unauthorized
  /goals:
    post:
      operationId: createGoal
      tags: [weeklyPlan]
      summary: Create a weekly goal under a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalInput"
      responses:
        "200":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyGoal"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "404":
          description: Role not found
  /goals/{goalId}:
    patch:
      operationId: updateGoal
      tags: [weeklyPlan]
      summary: Update a weekly goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalInput"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyGoal"
        "401":
          description: Unauthorized
        "404":
          description: Goal not found
    delete:
      operationId: deleteGoal
      tags: [weeklyPlan]
      summary: Delete a weekly goal together with its tasks
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Goal not found
  /tasks:
    post:
      operationId: createTask
      tags: [weeklyPlan]
      summary: Create a task under a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "200":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
        "404":
          description: Goal not found
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [weeklyPlan]
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [weeklyPlan]
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Task not found
  /principles:
    get:
      operationId: listPrinciples
      tags: [principles]
      summary: List all of the user's principles, ordered
      responses:
        "200":
          description: Principles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Principle"
        "401":
          description: Unauthorized
    post:
      operationId: createPrinciple
      tags: [principles]
      summary: Add a new principle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrincipleInput"
      responses:
        "200":
          description: Created principle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principle"
        "401":
          description: Unauthorized
  /principles/{principleId}:
    patch:
      operationId: updatePrinciple
      tags: [principles]
      summary: Update a principle's text or order
      parameters:
        - name: principleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrincipleInput"
      responses:
        "200":
          description: Updated principle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principle"
        "401":
          description: Unauthorized
        "404":
          description: Principle not found
    delete:
      operationId: deletePrinciple
      tags: [principles]
      summary: Delete a principle
      parameters:
        - name: principleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Principle not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Role:
      type: object
      required: [id, name, goal1, goal2]
      properties:
        id:
          type: string
        name:
          type: string
        goal1:
          type: string
        goal2:
          type: string
    Schedule:
      type: object
      required: [السبت, الأحد, الاثنين, الثلاثاء, الأربعاء, الخميس, الجمعة]
      properties:
        السبت:
          type: string
        الأحد:
          type: string
        الاثنين:
          type: string
        الثلاثاء:
          type: string
        الأربعاء:
          type: string
        الخميس:
          type: string
        الجمعة:
          type: string
    ReviewEntry:
      type: object
      required: [roleId, roleName, goalField, goalText, statusVal, reason, advice, concept]
      properties:
        roleId:
          type: string
        roleName:
          type: string
        goalField:
          type: string
        goalText:
          type: string
        statusVal:
          type: string
        reason:
          type: string
        advice:
          type: string
        concept:
          type: string
    Review:
      type: object
      required: [entries, message, completedAt]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ReviewEntry"
        message:
          type: string
        completedAt:
          type: string
    PlannerData:
      type: object
      required: [weekEndDate, roles, schedule, reflection]
      properties:
        weekEndDate:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        schedule:
          $ref: "#/components/schemas/Schedule"
        reflection:
          type: string
        review:
          oneOf:
            - $ref: "#/components/schemas/Review"
            - type: "null"
    PlannerDataInput:
      type: object
      required: [weekEndDate, roles, schedule, reflection]
      properties:
        weekEndDate:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        schedule:
          $ref: "#/components/schemas/Schedule"
        reflection:
          type: string
        review:
          oneOf:
            - $ref: "#/components/schemas/Review"
            - type: "null"
    ReviewAnalysisEntry:
      type: object
      required: [role, goal, status, reason]
      properties:
        role:
          type: string
        goal:
          type: string
        status:
          type: string
        reason:
          type: ["string", "null"]
    ReviewAnalysisInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ReviewAnalysisEntry"
    ReviewAnalysisItem:
      type: object
      required: [advice, concept]
      properties:
        advice:
          type: string
        concept:
          type: string
    ReviewAnalysis:
      type: object
      required: [items, message]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewAnalysisItem"
        message:
          type: string
    Mission:
      type: object
      required: [missionStatement, principles]
      properties:
        missionStatement:
          type: string
        principles:
          type: string
    MissionInput:
      type: object
      required: [missionStatement, principles]
      properties:
        missionStatement:
          type: string
        principles:
          type: string
    LifeRole:
      type: object
      required: [id, name, description, direction, isActive, sortOrder]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        direction:
          type: string
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: number
    CreateRoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        direction:
          type: string
          nullable: true
    UpdateRoleInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        direction:
          type: string
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: number

    WeeklyGoal:
      type: object
      required: [id, roleId, weekStartDate, title, description, quadrant, status]
      properties:
        id:
          type: string
        roleId:
          type: string
        weekStartDate:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        quadrant:
          type: string
          nullable: true
        status:
          type: string
          enum: [not_started, in_progress, done, partial]
    Task:
      type: object
      required: [id, goalId, title, quadrant, isDone]
      properties:
        id:
          type: string
        goalId:
          type: string
          nullable: true
        title:
          type: string
        quadrant:
          type: string
          nullable: true
        isDone:
          type: boolean
    WeekPlan:
      type: object
      required: [goals, tasks]
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyGoal"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
    CreateGoalInput:
      type: object
      required: [roleId, weekStartDate, title]
      properties:
        roleId:
          type: string
        weekStartDate:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
    UpdateGoalInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [not_started, in_progress, done, partial]
    CreateTaskInput:
      type: object
      required: [goalId, title]
      properties:
        goalId:
          type: string
        title:
          type: string
    UpdateTaskInput:
      type: object
      properties:
        title:
          type: string
        isDone:
          type: boolean

    Principle:
      type: object
      required: [id, text, sortOrder]
      properties:
        id:
          type: string
        text:
          type: string
        sortOrder:
          type: number
    CreatePrincipleInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
    UpdatePrincipleInput:
      type: object
      properties:
        text:
          type: string
        sortOrder:
          type: number
