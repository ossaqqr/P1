kind = "web"
previewPath = "/"
title = "Quadrant Two Weekly Planner"
description = "A responsive Arabic weekly planner based on Stephen Covey's Quadrant II principles, with role and goal planning, weekly scheduling, reflections, review analysis, cloud persistence, and PWA installation support."
version = "1.0.0"
id = "artifacts/weekly-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19742

[services.development]
run = "pnpm --filter @workspace/weekly-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weekly-planner", "run", "build" ]
serve = "static"
publicDir = "artifacts/weekly-planner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19742"
BASE_PATH = "/"
